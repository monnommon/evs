services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: evs
      POSTGRES_USER: evs
      POSTGRES_PASSWORD: ${DB_PASSWORD:-evsdev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evs"]
      interval: 5s
      retries: 10

  web:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn evs.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    environment:
      DATABASE_URL: postgresql://evs:${DB_PASSWORD:-evsdev}@db:5432/evs
      SECRET_KEY: ${SECRET_KEY:-django-insecure-change-me-in-prod}
      DEBUG: ${DEBUG:-false}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles:ro
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume: