{% extends "base.html" %}
{% block title %}Admin dashboard{% endblock %}
{% block content %}
<div class="card">
  <h1>Polls</h1>
  <table>
    <thead><tr><th>Title</th><th>Status</th><th>Anonymous</th><th>Ends</th><th></th></tr></thead>
    <tbody>
      {% for poll in polls %}
      <tr>
        <td><a href="/polls/{{ poll.id }}/">{{ poll.title }}</a></td>
        <td>{{ poll.status }}</td>
        <td>{{ poll.is_anonymous|yesno:"yes,no" }}</td>
        <td>{{ poll.end_at }}</td>
        <td><a href="/admin/polls/{{ poll.id }}/results/">results</a></td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
