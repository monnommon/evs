{% extends "base.html" %}
{% block title %}Admin login{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:3rem auto" data-testid="panel-login">
  <h1>Admin panel</h1>
  {% if error %}<p class="flash err">{{ error }}</p>{% endif %}
  <form method="post" action="/panel/login/">
    {% csrf_token %}
    <p><label>Email<br><input type="email" name="email" required autofocus></label></p>
    <p><label>Password<br><input type="password" name="password" required></label></p>
    <button type="submit">Sign in</button>
  </form>
  <p class="muted small">Session login — requires an Admin role account.</p>
</div>
{% endblock %}
