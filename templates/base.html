{% load i18n static %}<!DOCTYPE html>
{% get_current_language as LANGUAGE_CODE %}
<html lang="{{ LANGUAGE_CODE }}">
<head>
  <meta charset="utf-8">
  <title>{% block title %}EVS{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101c3b">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23101c3b'/%3E%3Cpath d='M8 17l5 5 11-11' stroke='%23fff' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <script defer src="{% static 'js/evs.js' %}"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">{% trans "Skip to content" %}</a>
  <nav class="topnav">
    <a href="/" class="brand"><span class="brand-mark" aria-hidden="true">✓</span><span>EVS</span></a>
    <div id="nav-links">
      {% block nav %}
      <a href="/panel/">{% trans "Admin panel" %}</a>
      {% endblock %}
    </div>
    <form id="lang-switcher" method="post" action="{% url 'set_language' %}">
      {% csrf_token %}
      <input name="next" type="hidden" value="{{ request.get_full_path }}">
      <button type="submit" name="language" value="ru" class="lang-btn{% if LANGUAGE_CODE == 'ru' %} active{% endif %}">RU</button>
      <span class="lang-sep">|</span>
      <button type="submit" name="language" value="en" class="lang-btn{% if LANGUAGE_CODE == 'en' %} active{% endif %}">EN</button>
    </form>
  </nav>
  <main id="main-content">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
